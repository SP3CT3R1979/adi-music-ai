<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADIX Music AI</title>
  <meta name="description" content="Aplicación inteligente para la gestión empresarial de ADIX Music Sonidos: analítica GA4, KPI, proyecciones, finanzas, cotizaciones y asistente con IA.">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="lock" class="lock" hidden></div>

  <div class="app">
    <aside class="sidebar" aria-label="Menú principal">
      <div class="brand">
        <img class="brand-logo" src="img/logo-adix-160.jpg" alt="Logo de ADIX Music Sonidos">
        <div class="brand-txt"><b>ADIX Music</b><small>Gestión con IA</small></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">Hacemos que tu evento suene increíble · Cusco</div>
    </aside>
    <div id="nav-bg" class="nav-bg"></div>

    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn only-mobile" aria-label="Abrir menú"></button>
        <h1 id="page-title">Inicio</h1>
        <div id="status" class="status-row"></div>
        <button id="btn-excel" class="btn btn-sm top-btn" title="Exportar todos los resultados a Excel"></button>
        <button id="btn-pdf" class="btn btn-sm top-btn" title="Imprimir esta pantalla o guardarla como PDF"></button>
        <button id="lock-btn" class="icon-btn" title="Bloquear" aria-label="Bloquear" hidden></button>
      </header>
      <main class="view"><div id="print-head" class="print-head"></div><div id="view"></div></main>
    </div>
  </div>

  <!-- Librerías (incluidas localmente para funcionar sin internet) -->
  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/vendor/chart.umd.min.js"></script>
  <!-- Datos incluidos: Excel del negocio y GA4 de demostración -->
  <script src="datos/datos-incluidos.js"></script>
  <!-- Núcleo -->
  <script src="js/core/util.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/excel.js"></script>
  <script src="js/core/kpi.js"></script>
  <script src="js/core/finanzas.js"></script>
  <script src="js/core/proyeccion.js"></script>
  <script src="js/core/ga4.js"></script>
  <script src="js/core/publicidad.js"></script>
  <script src="js/core/ia.js"></script>
  <script src="js/core/charts.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/exportar.js"></script>
  <script src="js/app.js"></script>
  <!-- Pantallas -->
  <script src="js/pages/inicio.js"></script>
  <script src="js/pages/ga4.js"></script>
  <script src="js/pages/ventas.js"></script>
  <script src="js/pages/proyecciones.js"></script>
  <script src="js/pages/publicidad.js"></script>
  <script src="js/pages/finanzas.js"></script>
  <script src="js/pages/cotizaciones.js"></script>
  <script src="js/pages/asistente.js"></script>
  <script src="js/pages/configuracion.js"></script>
</body>
</html>
